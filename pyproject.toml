[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azathoth-ui"
version = "1.4.0.dev0"
description = "A local editor for Azathoth workflows, served in your browser."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eris Discordia Montano" }
]
keywords = [
    "artificial-intelligence",
    "llm",
    "workflow-editor",
    "azathoth",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed"
]
dependencies = [
    "azathoth-ai==1.4.*",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
azathoth-ui = "azathoth_ui.cli:main"

[project.urls]
Homepage = "https://github.com/EldritchInc/azathoth-ui"
Repository = "https://github.com/EldritchInc/azathoth-ui"

[project.optional-dependencies]
dev = [
    "build",
    "httpx",
    "mypy",
    "pytest",
    "ruff",
    "setuptools>=68",
    "wheel",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azathoth_ui = ["py.typed", "assets/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "src"]
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true

# setuptools ships no types. Only setup.py builds on it: its one command
# subclasses setuptools' build_py.
[[tool.mypy.overrides]]
module = ["setuptools", "setuptools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["setup"]
disallow_subclassing_any = false
