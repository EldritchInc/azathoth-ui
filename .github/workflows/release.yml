name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds and checks exactly what is published: nothing is rebuilt after.
  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read the declared version
        id: version
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Require the tag to match the declared version
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the declared version $VERSION." >&2
            exit 1
          fi

      - name: Build the web app
        run: make install-web build-web

      - name: Build the distributions
        run: |
          python -m pip install build
          python -m build

      - name: Check the wheel
        run: python scripts/check_wheel.py dist/*.whl

      # The wheel alone, outside the checkout: its own requirement brings
      # Azathoth from PyPI, as it does for anyone who installs it.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/release-check"
          "$RUNNER_TEMP/release-check/bin/python" -m pip install dist/*.whl

      - name: Require the command to report the declared version
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test "$("$RUNNER_TEMP/release-check/bin/azathoth-ui" --version)" = "azathoth-ui $VERSION"

      - name: Start the editor and use it
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/release-check/bin/python" "$GITHUB_WORKSPACE/scripts/smoke.py"'

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/azathoth-ui

    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/azathoth-ui

    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
